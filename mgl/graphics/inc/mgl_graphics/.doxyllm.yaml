    This C++ header file, "mgl_graphics/command.hpp", serves as an abstraction layer for rendering commands in the MGL (My Graphics Library) framework. It defines several classes that represent different types of render commands, each with its own specific functionality. These include clear commands to set a background color, viewport commands to define the area of interest, and various matrix setting commands to control the camera's perspective and orientation. Additionally, it provides blend function and equation commands for managing blending operations in OpenGL-like rendering systems. Finally, there is a command to clear texture samplers within a specified range. This file plays an integral role in the broader codebase by providing a centralized location for these render commands, promoting code reusability and readability.

