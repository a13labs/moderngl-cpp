    2. `uniform_type` enum: This defines a set of possible types that can be passed to the shader program's uniform variables.
    3. `uniform_value` struct: This is used for passing different types of values to the shader program's uniform variables. It includes methods for setting and getting these values, as well as handling their respective data structures (bool, int, float, vectors, matrices).
    4. Shader management functions: These include `prepare()`, `load()`, `unload()`, which are used to prepare the shader for use, load it into memory, and unload it from memory respectively.
    5. Uniform value getter/setter methods: These allow getting and setting uniform values in various formats (bool, int, float, vectors, matrices) by name.
    
